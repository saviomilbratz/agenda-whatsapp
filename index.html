<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Agendar WhatsApp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color,#fff); --fg: var(--tg-theme-text-color,#111);
    --mut: var(--tg-theme-hint-color,#8a8a8e); --card: var(--tg-theme-secondary-bg-color,#f2f2f7);
    --acc: var(--tg-theme-button-color,#2481cc); --accfg: var(--tg-theme-button-text-color,#fff);
    --line: rgba(127,127,127,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:14px 14px 90px}
  h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 4px 8px}
  .card{background:var(--card);border-radius:14px;padding:12px}
  .contato{display:flex;align-items:center;gap:12px}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
  .contato b{font-size:17px}.contato small{display:block;color:var(--mut)}
  /* calendário */
  .mes{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .mes button{border:0;background:none;color:var(--acc);font-size:22px;padding:2px 10px}
  .mes b{font-size:16px;text-transform:capitalize}
  .grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .grade .dow{font-size:12px;color:var(--mut);padding:2px 0}
  .grade button{border:0;background:none;color:var(--fg);font-size:16px;height:38px;border-radius:50%;aspect-ratio:1;margin:auto;width:38px}
  .grade button.hoje{color:var(--acc);font-weight:700}
  .grade button.sel{background:var(--acc);color:var(--accfg);font-weight:700}
  .grade button:disabled{color:var(--mut);opacity:.35}
  .atalhos{display:flex;gap:8px;margin-top:10px}
  /* roda */
  .rodas{position:relative;display:flex;justify-content:center;gap:4px;height:200px;overflow:hidden}
  .roda{height:200px;width:80px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;
        -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
  .roda::-webkit-scrollbar{display:none}
  .roda div{height:40px;line-height:40px;text-align:center;font-size:24px;scroll-snap-align:center;color:var(--fg);font-variant-numeric:tabular-nums}
  .roda .pad{scroll-snap-align:none}
  .faixa{position:absolute;left:12%;right:12%;top:80px;height:40px;border-radius:9px;background:var(--line);pointer-events:none}
  .dois{position:absolute;top:80px;line-height:40px;font-size:24px;left:50%;transform:translateX(-50%);pointer-events:none}
  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:8px 14px;font-size:15px}
  .chip.sel{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
  .custom{display:none;gap:8px;margin-top:10px;align-items:center}
  .custom.on{display:flex}
  input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
  textarea{min-height:110px;resize:vertical}
  select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
  .resumo{color:var(--mut);font-size:14px;margin:14px 4px 0}
  .abas{display:flex;gap:6px;margin-bottom:10px}
  .abas .chip{flex:1;text-align:center}
  .grav{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
  .rec{width:74px;height:74px;border-radius:50%;border:0;background:#e53935;color:#fff;font-size:30px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .rec.on{animation:pulso 1.2s infinite;border-radius:18px}
  @keyframes pulso{50%{transform:scale(.92);opacity:.8}}
  .tempo{font-variant-numeric:tabular-nums;font-size:20px}
  .grav small{color:var(--mut);text-align:center}
  .grav audio{width:100%}
  .linkbtn{border:0;background:none;color:var(--acc);font-size:15px;padding:4px}
  #seq .item{background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px}
  #seq .topo{display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--mut);font-size:13px;font-weight:600}
  #seq .topo span{flex:1}
  #seq .topo button{border:0;background:var(--bg);color:var(--fg);border-radius:8px;width:32px;height:28px;font-size:14px}
  #seq img,#seq video{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:0 auto 8px}
  #seq audio{width:100%}
  #seq input.leg{margin-top:2px}
  .add{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
  .add .chip{flex:1;text-align:center;white-space:nowrap}
  .barra{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
  .barra div{height:100%;width:0;background:var(--acc);transition:width .2s}
  #fallback{position:fixed;left:14px;right:14px;bottom:14px;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:600;background:var(--acc);color:var(--accfg)}
</style>
</head>
<body>
  <div class="card contato">
    <div class="avatar" id="ini">?</div>
    <div><b id="nome">Contato</b><small>WhatsApp · envio pelo seu número</small></div>
  </div>

  <h2>📅 Data</h2>
  <div class="card">
    <div class="mes"><button id="ant">‹</button><b id="titMes"></b><button id="prox">›</button></div>
    <div class="grade" id="grade"></div>
    <div class="atalhos">
      <button class="chip" id="agora">⚡ Agora</button>
      <button class="chip" data-d="0">Hoje</button>
      <button class="chip" data-d="1">Amanhã</button>
    </div>
  </div>

  <div id="blocoHora">
    <h2>🕐 Hora</h2>
    <div class="card">
      <div class="rodas"><div class="faixa"></div>
        <div class="roda" id="rH"></div><div class="roda" id="rM"></div><span class="dois">:</span>
      </div>
    </div>
  </div>

  <h2>⏰ Avisar se não responder</h2>
  <div class="card">
    <div class="chips" id="avisos">
      <button class="chip" data-h="3">3h</button><button class="chip" data-h="6">6h</button>
      <button class="chip" data-h="12">12h</button><button class="chip" data-h="24">1 dia</button>
      <button class="chip" data-h="48">2 dias</button><button class="chip" data-h="x">✏️ Outro</button>
      <button class="chip sel" data-h="0">🔕 Não</button>
    </div>
    <div class="custom" id="custom">
      <input id="qtd" type="number" min="1" inputmode="decimal" placeholder="Quantidade">
      <select id="un"><option value="1">horas</option><option value="24">dias</option><option value="0.0166667">minutos</option></select>
    </div>
  </div>

  <h2>📨 Mensagens (na ordem de envio)</h2>
  <div id="seq"></div>
  <div class="add">
    <button class="chip" id="addTxt">＋ ✍️ Texto</button>
    <button class="chip" id="addAud">＋ 🎙️ Áudio</button>
    <button class="chip" id="addMid">＋ 🖼️ Foto/Vídeo</button>
    <input type="file" id="arq" accept="image/*,video/*" style="display:none">
  </div>

  <div class="resumo" id="resumo"></div>
  <button id="fallback">✅ Agendar</button>

<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
const P = new URLSearchParams(location.search);
const nome = P.get('n') || 'Contato'; document.getElementById('nome').textContent = nome;
document.getElementById('ini').textContent = nome.replace(/[^A-Za-zÀ-ú0-9]/g,'').slice(0,1).toUpperCase() || '?';
const _n = new Date(Date.now() + 5*60000);           // hora atual arredondada p/ os próximos 5 min
const st = {data: null /* hoje, logo abaixo */, agora: false, h: _n.getHours(), m: Math.ceil(_n.getMinutes()/5)*5 % 60, aviso: 0};
if (_n.getMinutes() > 55) st.h = (st.h + 1) % 24;
const hoje = new Date(); hoje.setHours(0,0,0,0);
let vis = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
st.data = iso(hoje);   // data pré-selecionada: hoje
const vib = () => tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();

function calendario(){
  document.getElementById('titMes').textContent = vis.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const g = document.getElementById('grade'); g.innerHTML = '';
  ['D','S','T','Q','Q','S','S'].forEach(x => g.insertAdjacentHTML('beforeend','<div class="dow">'+x+'</div>'));
  for (let i=0;i<vis.getDay();i++) g.insertAdjacentHTML('beforeend','<div></div>');
  const dias = new Date(vis.getFullYear(), vis.getMonth()+1, 0).getDate();
  for (let d=1; d<=dias; d++){
    const dt = new Date(vis.getFullYear(), vis.getMonth(), d), b = document.createElement('button');
    b.textContent = d; b.disabled = dt < hoje;
    if (+dt === +hoje) b.classList.add('hoje');
    if (!st.agora && st.data === iso(dt)) b.classList.add('sel');
    b.onclick = () => { st.data = iso(dt); st.agora = false; vib(); calendario(); atualiza(); };
    g.appendChild(b);
  }
  document.getElementById('agora').classList.toggle('sel', st.agora);
}
document.getElementById('ant').onclick = () => { vis.setMonth(vis.getMonth()-1); calendario(); };
document.getElementById('prox').onclick = () => { vis.setMonth(vis.getMonth()+1); calendario(); };
document.getElementById('agora').onclick = () => { st.agora = true; st.data = iso(new Date()); vib(); calendario(); atualiza(); };
document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
  const d = new Date(hoje); d.setDate(d.getDate() + +b.dataset.d); st.data = iso(d); st.agora = false;
  vis = new Date(d.getFullYear(), d.getMonth(), 1); vib(); calendario(); atualiza(); });

function roda(id, n, passo, inicial, cb){
  const r = document.getElementById(id);
  r.innerHTML = '<div class="pad"></div><div class="pad"></div>' +
    Array.from({length:n},(_,i)=>'<div>'+String(i*passo).padStart(2,'0')+'</div>').join('') +
    '<div class="pad"></div><div class="pad"></div>';
  requestAnimationFrame(() => { r.scrollTop = (inicial/passo)*40; setTimeout(() => { r.scrollTop = (inicial/passo)*40; }, 60); });
  let t; r.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(() => {
    const i = Math.round(r.scrollTop/40); cb(Math.min(n-1,i)*passo); vib(); atualiza(); }, 80); });
}
roda('rH', 24, 1, st.h, v => st.h = v);
roda('rM', 12, 5, st.m, v => st.m = v);

document.querySelectorAll('#avisos .chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('#avisos .chip').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
  document.getElementById('custom').classList.toggle('on', b.dataset.h === 'x');
  st.aviso = b.dataset.h === 'x' ? 'x' : +b.dataset.h; vib(); atualiza(); });
['qtd','un'].forEach(id => document.getElementById(id).addEventListener('input', atualiza));

// ---- sequência de mensagens
const MAX = 15 * 1024 * 1024;
const itens = [];   // {tipo:'texto'|'voz'|'midia', texto, blob, mime, legenda, chat}
let gravando = null;
function render(){
  const box = document.getElementById('seq'); box.innerHTML = '';
  itens.forEach((x, k) => {
    const d = document.createElement('div'); d.className = 'item';
    const nome = x.tipo === 'texto' ? '✍️ Texto' : x.tipo === 'voz' ? '🎙️ Áudio (mensagem de voz)' : (x.mime || '').startsWith('video') ? '🎬 Vídeo' : '🖼️ Foto';
    d.innerHTML = '<div class="topo"><span>' + (k + 1) + '. ' + nome + '</span>' +
      (k > 0 ? '<button data-a="up">↑</button>' : '') + (k < itens.length - 1 ? '<button data-a="down">↓</button>' : '') +
      '<button data-a="del">🗑️</button></div>';
    if (x.tipo === 'texto') {
      const t = document.createElement('textarea'); t.placeholder = 'Digite a mensagem…'; t.value = x.texto || '';
      t.oninput = () => { x.texto = t.value; atualiza(); }; d.appendChild(t);
    } else if (x.tipo === 'voz') {
      if (x.chat) d.insertAdjacentHTML('beforeend', '<small style="color:var(--mut)">Áudio enviado pelo chat (' + x.chat + ')</small>');
      else if (x.blob) { const a = document.createElement('audio'); a.controls = true; a.src = URL.createObjectURL(x.blob); d.appendChild(a); }
      else {
        const g = document.createElement('div'); g.className = 'grav';
        g.innerHTML = '<button class="rec">🎙️</button><div class="tempo">0:00</div><small>Toque para gravar · toque de novo para parar</small>';
        g.querySelector('.rec').onclick = () => gravar(x, g); d.appendChild(g);
      }
    } else {
      const url = URL.createObjectURL(x.blob);
      d.insertAdjacentHTML('beforeend', (x.mime || '').startsWith('video') ? '<video src="' + url + '" controls playsinline></video>' : '<img src="' + url + '">');
      const l = document.createElement('input'); l.className = 'leg'; l.placeholder = 'Legenda (opcional)'; l.value = x.legenda || '';
      l.oninput = () => { x.legenda = l.value; }; d.appendChild(l);
      d.insertAdjacentHTML('beforeend', '<small style="color:var(--mut)">' + (x.blob.size / 1048576).toFixed(1) + ' MB</small>');
    }
    d.querySelectorAll('.topo button').forEach(b => b.onclick = () => {
      if (b.dataset.a === 'del') itens.splice(k, 1);
      if (b.dataset.a === 'up') itens.splice(k - 1, 0, itens.splice(k, 1)[0]);
      if (b.dataset.a === 'down') itens.splice(k + 1, 0, itens.splice(k, 1)[0]);
      vib(); render(); });
    box.appendChild(d);
  });
  atualiza();
}
async function gravar(x, g){
  const b = g.querySelector('.rec');
  if (gravando && gravando.rec.state === 'recording') { gravando.rec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const tipo = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(stream, tipo ? {mimeType: tipo} : {}); const ped = []; const t0 = Date.now();
    const relogio = setInterval(() => { const e = (Date.now() - t0) / 1000; g.querySelector('.tempo').textContent = Math.floor(e / 60) + ':' + String(Math.floor(e % 60)).padStart(2, '0'); }, 250);
    rec.ondataavailable = e => e.data.size && ped.push(e.data);
    rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(relogio); gravando = null;
      x.blob = new Blob(ped, {type: rec.mimeType || tipo || 'audio/webm'}); x.mime = x.blob.type; render(); };
    gravando = {rec}; rec.start(250); b.classList.add('on'); b.textContent = '⏹'; g.querySelector('small').textContent = 'Gravando… toque para parar'; vib();
  } catch (e) {
    (tg && tg.showAlert ? tg.showAlert.bind(tg) : alert)('Não consegui usar o microfone aqui (' + e.name + '). Grave o áudio no chat do bot.');
  }
}
document.getElementById('addTxt').onclick = () => { itens.push({tipo: 'texto', texto: ''}); render();
  const ts = document.querySelectorAll('#seq textarea'); ts.length && ts[ts.length - 1].focus(); };
document.getElementById('addAud').onclick = () => { itens.push({tipo: 'voz'}); render(); };
document.getElementById('addMid').onclick = () => document.getElementById('arq').click();
document.getElementById('arq').onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.size > MAX) { (tg && tg.showAlert ? tg.showAlert.bind(tg) : alert)('Arquivo grande demais (' + (f.size / 1048576).toFixed(0) + ' MB). O limite é 15 MB.'); return; }
  itens.push({tipo: 'midia', blob: f, mime: f.type || 'application/octet-stream'}); render(); };

function avisoHoras(){
  if (st.aviso === 'x'){ const q = parseFloat(document.getElementById('qtd').value); return q > 0 ? Math.round(q * +document.getElementById('un').value * 100)/100 : null; }
  return st.aviso;
}
function falta(){
  const f = [];
  if (!st.data) f.push('data');
  if (avisoHoras() === null) f.push('aviso');
  if (!itens.length) f.push('mensagem');
  else if (itens.some(x => x.tipo === 'texto' && !(x.texto || '').trim())) f.push('texto vazio');
  else if (itens.some(x => x.tipo === 'voz' && !x.blob && !x.chat)) f.push('gravar o áudio');
  if (!st.agora && st.data){ const q = new Date(st.data+'T'+String(st.h).padStart(2,'0')+':'+String(st.m).padStart(2,'0')); if (q < new Date()) f.push('horário já passou'); }
  return f;
}
function atualiza(){
  document.getElementById('blocoHora').style.display = st.agora ? 'none' : '';
  const f = falta(), a = avisoHoras();
  const quando = st.agora ? 'agora' : st.data ? new Date(st.data+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}) + ' às ' + String(st.h).padStart(2,'0')+':'+String(st.m).padStart(2,'0') : '—';
  const av = a === null ? '—' : a === 0 ? 'não avisar' : (a >= 24 && a % 24 === 0 ? (a/24)+' dia(s)' : a+'h');
  document.getElementById('resumo').textContent = '📅 ' + quando + '   ·   ⏰ ' + av + (f.length ? '   ·   falta: ' + f.join(', ') : '');
  const ok = !f.length;
  if (tg && tg.MainButton){ tg.MainButton.setText(ok ? '✅ Agendar' : 'Falta: ' + f.join(', ')); ok ? tg.MainButton.enable() : tg.MainButton.disable(); tg.MainButton.show(); document.getElementById('fallback').style.display='none'; }
  document.getElementById('fallback').disabled = !ok; document.getElementById('fallback').style.opacity = ok ? 1 : .5;
}
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const deb64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4)), c => c.charCodeAt(0));
let enviando = false;
async function cifrar(bytes){
  const chave = await crypto.subtle.importKey('raw', deb64u(P.get('k')), 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, chave, bytes);
  const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12); return out;
}
// avisa o PC que o agendador foi aberto (o formulário não expira mais)
if (P.get('fid') && P.get('k') && P.get('tp')) cifrar(new TextEncoder().encode(JSON.stringify({fid: P.get('fid'), evento: 'aberto'})))
  .then(p => fetch('https://ntfy.sh/' + P.get('tp'), {method: 'POST', body: P.get('fid') + '.' + b64u(p)})).catch(() => {});
const mid = () => Math.random().toString(36).slice(2, 10);
function progresso(txt){ if (tg && tg.MainButton) tg.MainButton.setText(txt); else document.getElementById('fallback').textContent = txt; }
async function enviar(){
  if (falta().length || enviando) return;
  if (!P.get('fid') || !P.get('k') || !P.get('tp')) { alert('Protótipo — abra pelo botão do bot.'); return; }
  enviando = true;
  if (tg && tg.MainButton) tg.MainButton.showProgress();
  const url = 'https://ntfy.sh/' + P.get('tp'), fid = P.get('fid');
  try {
    const comAnexo = itens.filter(x => x.blob);
    let n = 0;
    for (const x of comAnexo) {
      n++; progresso('Enviando anexo ' + n + ' de ' + comAnexo.length + '…');
      x.mid = mid();
      const meta = await cifrar(new TextEncoder().encode(JSON.stringify({fid, evento: 'midia', mid: x.mid, mime: x.mime})));
      const corpo = await cifrar(new Uint8Array(await x.blob.arrayBuffer()));
      const r = await fetch(url, {method: 'PUT', body: corpo, headers: {'Filename': 'a.bin', 'X-Message': fid + '.' + b64u(meta)}});
      if (!r.ok) throw new Error('anexo ' + n + ': HTTP ' + r.status + (r.status === 413 ? ' (arquivo grande demais)' : ''));
    }
    progresso('Agendando…');
    const seq = itens.map(x => x.tipo === 'texto' ? {tipo: 'texto', texto: x.texto.trim()}
                         : x.chat ? {tipo: 'voz', chat: true} : {tipo: x.tipo, mid: x.mid, legenda: x.legenda || null});
    const dados = {fid, data: st.agora ? 'agora' : st.data, hora: st.agora ? null : String(st.h).padStart(2,'0')+':'+String(st.m).padStart(2,'0'),
                   aviso: avisoHoras(), itens: seq};
    const pacote = await cifrar(new TextEncoder().encode(JSON.stringify(dados)));
    const r = await fetch(url, {method: 'POST', body: fid + '.' + b64u(pacote)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    if (tg) tg.close(); else alert('Enviado!');
  } catch (e) {
    enviando = false;
    if (tg && tg.MainButton) tg.MainButton.hideProgress();
    atualiza();
    (tg && tg.showAlert ? tg.showAlert.bind(tg) : alert)('Não consegui enviar: ' + e.message + '. Tente de novo.');
  }
}

if (tg && tg.MainButton) tg.MainButton.onClick(enviar);
document.getElementById('fallback').onclick = enviar;
